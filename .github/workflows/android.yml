name: Android

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "tools/build_android.py"
      - "app/neutralino.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Put the app page into the Android project
        run: python3 tools/build_android.py

      - name: Load the upload key if it's set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 isn't set, so the Play bundle is unsigned."
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleDebug bundleRelease

      - name: Enable the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/smoke.sh

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(jq -r .version app/neutralino.config.json)
          cp android/app/build/outputs/apk/debug/app-debug.apk "shots/iv31-$v-android-test.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "shots/iv31-$v-android.aab"
          gh release delete android-ci --yes --cleanup-tag 2>/dev/null || true
          gh release create android-ci --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Android test build" \
            --notes "Automatic Android test build from $GITHUB_SHA. For testing only: purchases don't work outside Google Play." \
            shots/*
