name: Release

on:
  push:
    branches: [main]
    paths:
      - "updates/manifest.json"
      - "release-notes/**"
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/release.sh
